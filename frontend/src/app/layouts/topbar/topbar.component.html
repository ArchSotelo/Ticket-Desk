    <header class="topbar">
      <div class="topbar-left">
        <button mat-icon-button class="menu-btn" (click)="toggleSidebar.emit()" [attr.aria-expanded]="sidebarExpanded" [attr.aria-label]="sidebarExpanded ? 'Plegar menú' : 'Abrir menú'">
          <mat-icon>menu</mat-icon>
        </button>
        <div class="brand-title">
          <span class="logo-icon">confirmation_number</span>
          <span class="brand-name">ServiceDesk <strong>Pro</strong></span>
        </div>
      </div>

      <div class="topbar-right">
        <button mat-icon-button class="ghost-icon-btn" (click)="toggleTheme()" aria-label="Cambiar tema">
          <mat-icon>{{ isDarkMode ? 'light_mode' : 'dark_mode' }}</mat-icon>
        </button>

        <button
          mat-icon-button
          class="notification-btn"
          [matMenuTriggerFor]="notifMenu"
          (menuOpened)="refreshNotifications()"
          aria-label="Notificaciones">
          <mat-icon>notifications</mat-icon>
          <span class="badge-dot" *ngIf="unreadCount > 0"></span>
        </button>

        <div class="user-profile" [matMenuTriggerFor]="profileMenu">
          <div class="avatar">{{ userInitials }}</div>
          <span class="username">{{ currentUser?.fullName }}</span>
          <mat-icon>arrow_drop_down</mat-icon>
        </div>

        <mat-menu #notifMenu="matMenu" class="notif-menu">
          <div class="notif-header">
            <strong>Notificaciones</strong>
            <button mat-button type="button" (click)="markAllRead($event)" [disabled]="!notifications.length">
              Marcar todo leído
            </button>
          </div>

          <button mat-menu-item *ngFor="let notification of notifications" (click)="openNotification(notification, $event)">
            <mat-icon>{{ notification.tipo === 'ALERTA' ? 'warning' : 'notifications' }}</mat-icon>
            <span class="notif-item">
              <strong>{{ notification.titulo }}</strong>
              <small>{{ notification.mensaje }}</small>
            </span>
          </button>

          <div class="notif-empty" role="alert" *ngIf="notificationError">{{ notificationError }}</div>
          <div class="notif-empty" *ngIf="!notifications.length && !notificationError">
            No tienes notificaciones nuevas.
          </div>
        </mat-menu>

        <mat-menu #profileMenu="matMenu">
          <button mat-menu-item (click)="openApiDocumentation()">
            <mat-icon>description</mat-icon>
            <span>Documentación de la API</span>
          </button>
          <button mat-menu-item (click)="goToProfile()">
            <mat-icon>account_circle</mat-icon>
            <span>Mi Perfil</span>
          </button>
          <button mat-menu-item (click)="logout()">
            <mat-icon>exit_to_app</mat-icon>
            <span>Cerrar Sesión</span>
          </button>
        </mat-menu>
      </div>
    </header>
