    <div class="ticket-create-page">
      <div class="page-header">
        <div>
          <h2>Crear Nuevo Ticket de Soporte</h2>
          <p>Registra una nueva incidencia o solicitud para la mesa de ayuda</p>
        </div>
      </div>

      <div class="jira-card form-card">
        <form [formGroup]="ticketForm" (ngSubmit)="onSubmit()">
          <div class="row">
            <div class="col-md-8">
              <mat-form-field appearance="outline" class="w-100 mb-3">
                <mat-label>Título Resumido de la Incidencia</mat-label>
                <input matInput formControlName="titulo" placeholder="Ej. Error al conectar a la VPN corporativa">
              </mat-form-field>
            </div>

            <div class="col-md-4">
              <mat-form-field appearance="outline" class="w-100 mb-3">
                <mat-label>Prioridad</mat-label>
                <mat-select formControlName="prioridadId">
                  <mat-option *ngFor="let p of prioridades" [value]="p.id">
                    {{ p.nombre }}
                  </mat-option>
                </mat-select>
              </mat-form-field>
            </div>
          </div>

          <div class="row">
            <div class="col-md-6">
              <mat-form-field appearance="outline" class="w-100 mb-3">
                <mat-label>Categoría</mat-label>
                <mat-select formControlName="categoriaId" (selectionChange)="onCategoriaChange($event.value)">
                  <mat-option *ngFor="let c of categorias" [value]="c.id">
                    {{ c.nombre }}
                  </mat-option>
                </mat-select>
              </mat-form-field>
            </div>

            <div class="col-md-6">
              <mat-form-field appearance="outline" class="w-100 mb-3">
                <mat-label>Subcategoría</mat-label>
                <mat-select formControlName="subcategoriaId">
                  <mat-option *ngFor="let sc of subcategorias" [value]="sc.id">
                    {{ sc.nombre }}
                  </mat-option>
                </mat-select>
              </mat-form-field>
            </div>
          </div>

          <mat-form-field appearance="outline" class="w-100 mb-3">
            <mat-label>Descripción Detallada (Pasos para reproducir el problema)</mat-label>
            <textarea matInput formControlName="descripcion" rows="6" placeholder="Describe los síntomas, mensajes de error y contexto..."></textarea>
          </mat-form-field>

          <div class="form-actions">
            <button mat-stroked-button (click)="router.navigate(['/tickets/list'])" type="button">Cancelar</button>
            <button mat-raised-button color="primary" [disabled]="ticketForm.invalid || loading">
              <mat-icon>send</mat-icon> {{ loading ? 'Registrando...' : 'Registrar Ticket' }}
            </button>
          </div>
        </form>
      </div>
    </div>
